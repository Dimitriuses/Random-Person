<div class="row">
    <div class="col-12 mb-3">
        <button class="btn btn-success mr-2" (click)="onGenerate()">Generate</button>
        <button class="btn btn-outline-secondary" (click)="update()">Update</button>
    </div>
</div>
<div class="row">
    <div class="col-12">
        <app-person-item *ngFor="let person of personList" [singlePerson]="person"
            (selectedPerson)="onPersonSelected(person)"
            (deletedPerson)="onDeletePerson(person)"></app-person-item>
    </div>
</div>
