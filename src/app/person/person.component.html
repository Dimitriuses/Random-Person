<div class="container py-3">
    <h1 class="h3 mb-3">Random Person</h1>
    <div class="row">
        <div class="col-md-5">
            <app-person-list (getSelectedPerson)="activePerson = $event"></app-person-list>
        </div>
        <div class="col-md-7">
            <app-person-detail *ngIf="activePerson; else eventInfo" [person]="activePerson"></app-person-detail>
            <ng-template #eventInfo>
                <h3>Select Person!</h3>
            </ng-template>
        </div>
    </div>
</div>
